name: Verificar Ponto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Verificar sintaxe dos módulos
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
